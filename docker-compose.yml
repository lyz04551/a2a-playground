    environment:
      AGENT_PUBLIC_URL: http://k8s-gpu-specialist:8058
      K8S_MCP_URL: ${K8S_MCP_URL:-http://10.2.0.57:9096/mcp}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-streamable_http}
      AGENT_LLM_PROVIDER: ${AGENT_LLM_PROVIDER:-openai-compatible}
      AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY:-}
      AGENT_LLM_BASE_URL: ${AGENT_LLM_BASE_URL:-https://api.deepseek.com/v1}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-deepseek-chat}
    ports:
      - "8058:8058"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8058/.well-known/agent-card.json')"]
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PLAYGROUND_DB_PATH: /app/data/playground.db
      HOST_LLM_PROVIDER: ${HOST_LLM_PROVIDER:-deepseek}
      HOST_LLM_API_KEY: ${HOST_LLM_API_KEY:-}
      HOST_LLM_BASE_URL: ${HOST_LLM_BASE_URL:-https://api.deepseek.com/v1}
      HOST_LLM_MODEL: ${HOST_LLM_MODEL:-deepseek-chat}
      BOOTSTRAP_AGENTS: >-
        [{"id":"k8s-incident-responder","url":"http://k8s-incident-responder:8056","risk_level":"read_only"},{"id":"k8s-capacity-planner","url":"http://k8s-capacity-planner:8057","risk_level":"read_only"},{"id":"k8s-gpu-specialist","url":"http://k8s-gpu-specialist:8058","risk_level":"write_approval"},{"id":"k8s-ops","url":"http://k8s-ops:8052","risk_level":"write_approval"},{"id":"k8s-security","url":"http://k8s-security:8053","risk_level":"read_only"},{"id":"k8s-infrastructure","url":"http://k8s-infrastructure:8054","risk_level":"write_approval"},{"id":"k8s-helm","url":"http://k8s-helm:8055","risk_level":"write_approval"},{"id":"k8s-orchestrator","url":"http://k8s-orchestrator:8051","risk_level":"write_approval"}]
      PLAYGROUND_ALLOW_PRIVATE_AGENTS: "true"
      PLAYGROUND_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      HOST_MAX_TASKS: ${HOST_MAX_TASKS:-12}
      HOST_MAX_ROUNDS: ${HOST_MAX_ROUNDS:-8}
      HOST_MAX_CONCURRENCY: ${HOST_MAX_CONCURRENCY:-3}
      HOST_MAX_ATTEMPTS: ${HOST_MAX_ATTEMPTS:-2}
    ports:
      - "8050:8050"
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request=urllib.request.Request('http://127.0.0.1:8050/api/ping', data=b'{}', headers={'Content-Type':'application/json'}); urllib.request.urlopen(request)"]
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped

volumes:
  backend_data:
