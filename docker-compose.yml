services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-a2a}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-a2a_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-playground}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  backend-migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.persistence.migrate"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-a2a}:${POSTGRES_PASSWORD:-a2a_dev_password}@postgres:5432/${POSTGRES_DB:-playground}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  checkpoint-migrate:
    build:
      context: .
      dockerfile: agents/k8s-orchestrator/Dockerfile
    command: ["python", "-m", "a2a_runtime.checkpoint_migrate"]
    working_dir: /app
    environment:
      AGENT_CHECKPOINT_DATABASE_URL: postgresql://${POSTGRES_USER:-a2a}:${POSTGRES_PASSWORD:-a2a_dev_password}@postgres:5432/langgraph
      LANGGRAPH_STRICT_MSGPACK: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  k8s-orchestrator:
    build:
      context: .
      dockerfile: agents/k8s-orchestrator/Dockerfile
    environment:
      AGENT_PUBLIC_URL: http://k8s-orchestrator:8051
      K8S_MCP_URL: ${K8S_MCP_URL:-http://10.2.0.57:9096/mcp}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-streamable_http}
      AGENT_LLM_PROVIDER: ${AGENT_LLM_PROVIDER:-openai-compatible}
      AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY:-}
      AGENT_LLM_BASE_URL: ${AGENT_LLM_BASE_URL:-https://api.deepseek.com/v1}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-deepseek-chat}
      AGENT_RUN_TIMEOUT: ${AGENT_RUN_TIMEOUT:-180}
      AGENT_SUMMARY_RESERVE_SECONDS: ${AGENT_SUMMARY_RESERVE_SECONDS:-35}
      AGENT_TIMEOUT_SAFETY_MARGIN_SECONDS: ${AGENT_TIMEOUT_SAFETY_MARGIN_SECONDS:-5}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-12}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-16}
      AGENT_CHECKPOINT_DATABASE_URL: postgresql://${POSTGRES_USER:-a2a}:${POSTGRES_PASSWORD:-a2a_dev_password}@postgres:5432/langgraph
      LANGGRAPH_STRICT_MSGPACK: "true"
    depends_on:
      checkpoint-migrate:
        condition: service_completed_successfully
    ports:
      - "8051:8051"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8051/.well-known/agent-card.json')"]
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped

  k8s-ops:
    build:
      context: .
      dockerfile: agents/k8s-ops/Dockerfile
    environment:
      AGENT_PUBLIC_URL: http://k8s-ops:8052
      K8S_MCP_URL: ${K8S_MCP_URL:-http://10.2.0.57:9096/mcp}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-streamable_http}
      AGENT_LLM_PROVIDER: ${AGENT_LLM_PROVIDER:-openai-compatible}
      AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY:-}
      AGENT_LLM_BASE_URL: ${AGENT_LLM_BASE_URL:-https://api.deepseek.com/v1}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-deepseek-chat}
      AGENT_RUN_TIMEOUT: ${AGENT_RUN_TIMEOUT:-180}
      AGENT_SUMMARY_RESERVE_SECONDS: ${AGENT_SUMMARY_RESERVE_SECONDS:-35}
      AGENT_TIMEOUT_SAFETY_MARGIN_SECONDS: ${AGENT_TIMEOUT_SAFETY_MARGIN_SECONDS:-5}
      AGENT_MAX_TOOL_CALLS: ${OPS_AGENT_MAX_TOOL_CALLS:-20}
      AGENT_MAX_STEPS: ${OPS_AGENT_MAX_STEPS:-24}
      AGENT_TOOL_BUDGET_WARNING_RATIO: ${OPS_AGENT_TOOL_BUDGET_WARNING_RATIO:-0.7}
      AGENT_CHECKPOINT_DATABASE_URL: postgresql://${POSTGRES_USER:-a2a}:${POSTGRES_PASSWORD:-a2a_dev_password}@postgres:5432/langgraph
      LANGGRAPH_STRICT_MSGPACK: "true"
    depends_on:
      checkpoint-migrate:
        condition: service_completed_successfully
    ports:
      - "8052:8052"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8052/.well-known/agent-card.json')"]
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped

  k8s-security:
    build:
      context: .
      dockerfile: agents/k8s-security/Dockerfile
    environment:
      AGENT_PUBLIC_URL: http://k8s-security:8053
      K8S_MCP_URL: ${K8S_MCP_URL:-http://10.2.0.57:9096/mcp}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-streamable_http}
      AGENT_LLM_PROVIDER: ${AGENT_LLM_PROVIDER:-openai-compatible}
      AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY:-}
      AGENT_LLM_BASE_URL: ${AGENT_LLM_BASE_URL:-https://api.deepseek.com/v1}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-deepseek-chat}
      AGENT_RUN_TIMEOUT: ${AGENT_RUN_TIMEOUT:-180}
      AGENT_SUMMARY_RESERVE_SECONDS: ${AGENT_SUMMARY_RESERVE_SECONDS:-35}
      AGENT_TIMEOUT_SAFETY_MARGIN_SECONDS: ${AGENT_TIMEOUT_SAFETY_MARGIN_SECONDS:-5}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-12}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-16}
      AGENT_CHECKPOINT_DATABASE_URL: postgresql://${POSTGRES_USER:-a2a}:${POSTGRES_PASSWORD:-a2a_dev_password}@postgres:5432/langgraph
      LANGGRAPH_STRICT_MSGPACK: "true"
    depends_on:
      checkpoint-migrate:
        condition: service_completed_successfully
    ports:
      - "8053:8053"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8053/.well-known/agent-card.json')"]
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-a2a}:${POSTGRES_PASSWORD:-a2a_dev_password}@postgres:5432/${POSTGRES_DB:-playground}
      HOST_LLM_PROVIDER: ${HOST_LLM_PROVIDER:-deepseek}
      HOST_LLM_API_KEY: ${HOST_LLM_API_KEY:-}
      HOST_LLM_BASE_URL: ${HOST_LLM_BASE_URL:-https://api.deepseek.com/v1}
      HOST_LLM_MODEL: ${HOST_LLM_MODEL:-deepseek-chat}
      BOOTSTRAP_AGENTS: >-
        [{"id":"k8s-ops","url":"http://k8s-ops:8052","risk_level":"write_approval"},{"id":"k8s-security","url":"http://k8s-security:8053","risk_level":"read_only"},{"id":"k8s-orchestrator","url":"http://k8s-orchestrator:8051","risk_level":"write_approval"}]
      PLAYGROUND_ALLOW_PRIVATE_AGENTS: "true"
      PLAYGROUND_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      HOST_MAX_TASKS: ${HOST_MAX_TASKS:-12}
      HOST_MAX_ROUNDS: ${HOST_MAX_ROUNDS:-8}
      HOST_MAX_CONCURRENCY: ${HOST_MAX_CONCURRENCY:-3}
      HOST_MAX_ATTEMPTS: ${HOST_MAX_ATTEMPTS:-2}
    ports:
      - "8050:8050"
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request=urllib.request.Request('http://127.0.0.1:8050/api/ping', data=b'{}', headers={'Content-Type':'application/json'}); urllib.request.urlopen(request)"]
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
