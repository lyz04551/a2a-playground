[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-k8s-runtime"
version = "0.1.0"
description = "Shared runtime for A2A Kubernetes agents"
requires-python = ">=3.11"
dependencies = [
  "a2a-sdk==0.3.25",
  "httpx>=0.27,<1",
  "langchain-core>=0.3,<2",
  "langchain-openai>=0.3,<2",
  "langgraph>=0.2,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "mcp>=1.0,<2",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["a2a_runtime*"]
