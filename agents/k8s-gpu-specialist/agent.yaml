agent_id: k8s-gpu-specialist
name: K8s GPU Specialist
description: Kubernetes GPU and large-model workload generation, deployment, and diagnosis.
read_only: false
risk_level: write_approval
limitations:
  - GPU workload mutations require approval
priority: 15
port: 8058
public_url: ${AGENT_PUBLIC_URL}
mcp_url: ${K8S_MCP_URL}
skills:
  - id: gpu.workload_manage
    name: Kubernetes GPU Workload Management
    description: Generate, deploy, and diagnose vLLM, Metax, and MThreads GPU workloads.
    tags: [kubernetes, gpu, vllm, metax, mthreads, inference]
    examples:
      - Deploy a reviewed vLLM workload on compatible GPU nodes.
tool_policy:
  allow:
    - get_large_model_yaml_example
    - get_metax_gpu_pod_yaml
    - get_mthreads_gpu_pod_yaml
    - list_k8s_clusters
    - list_k8s_namespace
    - list_k8s_node
    - list_k8s_pod
    - describe_k8s_pod
    - list_k8s_pod_event
    - get_k8s_pod_logs
    - get_k8s_pod_resource_usage
    - get_k8s_resource
    - list_k8s_resource
  deny: []
  approval_required:
    - apply_k8s_yaml
    - patch_k8s_resource
    - delete_k8s_resource
    - restart_k8s_deployment
    - scale_k8s_deployment
