agent_id: k8s-incident-responder
name: K8s Incident Responder
description: Evidence-driven Kubernetes incident diagnosis across status, events, logs, resources, network, and storage.
read_only: true
risk_level: read_only
limitations:
  - diagnoses incidents but does not mutate resources
priority: 10
port: 8056
public_url: ${AGENT_PUBLIC_URL}
mcp_url: ${K8S_MCP_URL}
skills:
  - id: incident.respond
    name: Kubernetes Incident Response
    description: Diagnose CrashLoopBackOff, Pending, rollout, availability, network, and storage incidents.
    tags: [kubernetes, incident, crashloop, pending, unavailable, diagnosis]
    examples:
      - Diagnose why a Pod is crashing or a Service is unavailable.
tool_policy:
  allow:
    - list_k8s_clusters
    - list_k8s_namespace
    - list_k8s_pod
    - describe_k8s_pod
    - list_k8s_pod_event
    - list_k8s_deploy_event
    - list_k8s_event
    - get_k8s_pod_logs
    - get_k8s_pod_resource_usage
    - get_k8s_pod_linked_services
    - get_pod_linked_endpoints
    - get_pod_linked_ingresses
    - get_k8s_pod_linked_pv
    - get_k8s_pod_linked_pvc
    - get_k8s_deployment_rollout_status
    - get_k8s_resource
    - describe_k8s_resource
  deny: []
  approval_required: []
