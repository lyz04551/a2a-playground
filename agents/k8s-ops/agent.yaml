agent_id: k8s-ops
name: K8s Ops Agent
description: Read-only Kubernetes inspection, diagnostics, logs, events, and resource usage.
read_only: true
risk_level: read_only
limitations:
  - Does not mutate Kubernetes resources or execute commands in Pods
priority: 20
port: 8052
public_url: ${AGENT_PUBLIC_URL}
mcp_url: ${K8S_MCP_URL}
skills:
  - id: cluster.inspect
    name: Kubernetes Cluster Inspection
    description: Inspect clusters, resources, events, logs, and resource pressure.
    tags: [kubernetes, operations, inspection, events, logs]
    examples:
      - Check the health and resource usage of a namespace.
  - id: pod.debug
    name: Kubernetes Pod Debugging
    description: Inspect Pod relationships, logs, events, files, and linked resources without mutation.
    tags: [kubernetes, pod, debugging, inspection, files]
    examples:
      - Inspect Pod logs, files, services, endpoints, and storage links.
tool_policy:
  allow:
    - list_k8s_*
    - get_k8s_*
    - get_pod_*
    - describe_k8s_*
    - list_files_in_k8s_pod
    - list_pod_all_files
  deny: []
  approval_required: []
