agent_id: k8s-ops
name: K8s Ops Agent
description: Kubernetes inspection, diagnostics, logs, events, resource usage, and approved Pod debugging.
read_only: false
risk_level: write_approval
limitations:
  - Pod mutations and command execution require approval
priority: 20
port: 8052
public_url: ${AGENT_PUBLIC_URL}
mcp_url: ${K8S_MCP_URL}
skills:
  - id: cluster.inspect
    name: Kubernetes Cluster Inspection
    description: Inspect clusters, resources, events, logs, and resource pressure.
    tags: [kubernetes, operations, inspection, events, logs]
    examples:
      - Check the health and resource usage of a namespace.
  - id: pod.debug
    name: Kubernetes Pod Debugging
    description: Inspect Pod relationships and perform explicitly approved command or file operations.
    tags: [kubernetes, pod, debugging, exec, files]
    examples:
      - Inspect Pod logs, files, services, endpoints, and storage links.
tool_policy:
  allow:
    - list_k8s_*
    - get_k8s_*
    - get_pod_*
    - describe_k8s_*
    - list_files_in_k8s_pod
    - list_pod_all_files
  deny: []
  approval_required:
    - run_command_in_k8s_pod
    - upload_file_to_k8s_pod
    - delete_pod_file
    - delete_k8s_pod
